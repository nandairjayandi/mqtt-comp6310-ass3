services:
  broker:
    build:
      context: .
      dockerfile: broker/Dockerfile
    volumes:
      - ./out/broker:/var/lib/mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"

  publisher:
    build:
      context: .
      dockerfile: publisher/Dockerfile
    command: ["./publisher", "tcp://broker:1883"]
    volumes:
      # - ./out/publisher:/app/logs
      - ./out/publisher:/out/publisher
      - ./out/analyser:/out/analyser:ro
    depends_on:
      - broker

  analyser:
    build:
      context: .
      dockerfile: analyser/Dockerfile
    command: ["./analyser", "tcp://broker:1883"]
    volumes:
      # - ./out/analyser:/app/logs
      - ./out/analyser:/out/analyser 
      - ./out/publisher:/out/publisher:ro
    # environment:
    #   - INFLUXDB_URL=http://influxdb:8086
    #   - INFLUXDB_TOKEN=comp6310ass3
    #   - INFLUXDB_ORG=mqtt-ass3
    #   - INFLUXDB_BUCKET=mqtt_data
    #   - INFLUXDB_SAMPLE_RATE=100 
    depends_on:
      broker:
        condition: service_started
      # influxdb:
      #   condition: service_healthy  # wait for influxdb to be ready

